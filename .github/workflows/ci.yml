name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is already going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check and build
        run: npm run build

  database:
    name: Database
    runs-on: ubuntu-latest
    env:
      # Only needed so the local Supabase config loads; Google login isn't used in tests
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Postgres and apply all migrations
        run: supabase db start

      - name: RLS and medicine rule tests (pgTAP)
        run: supabase test db
